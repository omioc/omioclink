name: Release

# 打 tag 即发版：
#
#   git tag v1.0.3 && git push origin v1.0.3
#
# 依次做：版本号校验 → 客户端 Windows / Android 构建 → 服务端镜像构建推送 → 导出离线镜像包 → 建 GitHub Release。
#
# 一次发版产出的东西（和三个 README 里的下载/部署说明一一对应）：
#   omioclink-client-win-x64-<版本>.zip           ← 根 README「Windows 免安装版下载」
#   omioclink-client-android-<版本>-arm64-v8a.apk ← 根 README「Android APK 下载」
#   omioclink-server-<版本>-amd64.tar             ← server/README「方式一：从项目下载 tar 包离线部署」
#   omioclink-server-<版本>-arm64.tar             ← 同上（ARM 主机）
#   Docker Hub: omioc/omioclink:latest 与 omioc/omioclink:v<版本>（多架构 manifest）
#
# 镜像名固定带 latest：`deploy/docker-compose.yml` 与 `server/docker-compose.yml` 都写的是
# `${OMIOCLINK_IMAGE:-omioc/omioclink:latest}`，离线包 load 进来的 tag 必须是 latest 才对得上，
# 带版本号的那个 tag 只用于固定版本 / 回滚（README 第十节）。
#
# 仓库 Secrets 需要：
#   DOCKERHUB_USERNAME   Docker Hub 账号
#   DOCKERHUB_TOKEN      Docker Hub Access Token（不是登录密码）
#
# 发行说明：把 `.github/release-notes/<tag>.md`（例如 v1.0.3.md）写好，Release 正文就用它；
# 没有这个文件时退回「自上一个 tag 以来的提交列表」。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 与 client/README「环境要求」保持一致
  FLUTTER_VERSION: "3.47.7"
  IMAGE: omioc/omioclink

jobs:
  version:
    name: 版本号校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          # tag 形如 v1.0.3：tag 是对外的，version 是不带 v 的版本号（产物文件名用它）
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PUBSPEC=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' client/pubspec.yaml | head -n1)
          PYPROJECT=$(sed -n 's/^version *= *"\(.*\)"/\1/p' server/pyproject.toml | head -n1)
          echo "tag=$TAG version=$VERSION pubspec=$PUBSPEC pyproject=$PYPROJECT"
          # 三处必须一致：tag（对外）、客户端 pubspec、服务端 pyproject。
          # 不一致就直接失败，别发一个「版本号对不上」的包出去。
          # 客户端里的字面量（app_version.dart / Runner.rc）由 client/tool/sync_version.dart 从 pubspec 生成，
          # 下面两个客户端 job 都会跑 --check 兜一遍。
          if [ "$VERSION" != "$PUBSPEC" ]; then
            echo "::error::client/pubspec.yaml 是 $PUBSPEC，与 tag $TAG 不一致"
            exit 1
          fi
          if [ "$VERSION" != "$PYPROJECT" ]; then
            echo "::error::server/pyproject.toml 是 $PYPROJECT，与 tag $TAG 不一致"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    name: 客户端 · Windows
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 只给 flutter-version：走 SDK 压缩包（带缓存）。同时给 channel 会让 action
          # 退化成 git clone stable 分支再 checkout，在 runner 上能慢到十几分钟
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run tool/sync_version.dart --check
      - run: flutter build windows --release
      - name: 补 VC++ 运行库（Flutter 模板不会把它装进 Release）
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "找不到 vswhere，runner 的 VS 环境不对" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "找不到带 C++ 工具集的 Visual Studio" }

          # 目录名随工具集版本变：VS2022 是 v143\Microsoft.VC143.CRT，VS18 是 v145\Microsoft.VC145.CRT。
          # 所以不要写死 CRT 文件夹名，按版本从新到旧扫一遍，取第一个存在的 x64\Microsoft.VC*.CRT。
          $redistRoot = Join-Path $vs 'VC\Redist\MSVC'
          $crtDir = Get-ChildItem $redistRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Get-ChildItem (Join-Path $_.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $crtDir) {
            throw "在 $redistRoot 下找不到 x64\Microsoft.VC*.CRT，看看 runner 的 VS 布局"
          }
          Write-Host "从 $($crtDir.FullName) 拷运行库"
          Copy-Item (Join-Path $crtDir.FullName '*.dll') 'build\windows\x64\runner\Release\' -Force
          Get-ChildItem 'build\windows\x64\runner\Release' -Filter '*140*.dll' | ForEach-Object { Write-Host "  已放入 $($_.Name)" }
          if (-not (Test-Path 'build\windows\x64\runner\Release\vcruntime140.dll')) {
            throw 'vcruntime140.dll 没拷进去，别发出一个起不来的包'
          }
      - name: 收拢产物
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File tool/stage_release.ps1 -Target windows
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: releases/client-v${{ needs.version.outputs.version }}/*.zip
          if-no-files-found: error

  android:
    name: 客户端 · Android
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          # 只给 flutter-version：走 SDK 压缩包（带缓存）。同时给 channel 会让 action
          # 退化成 git clone stable 分支再 checkout，在 runner 上能慢到十几分钟
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run tool/sync_version.dart --check
      # 分包：单 ABI 约 39 MB，比 113 MB 的全量包更适合放进 Release
      # 只出分包 APK；AAB 是给 Google Play 的，Release 里不分发也不构建（见 client/README 第三节）
      - run: flutter build apk --release --split-per-abi
      - name: 收拢产物
        run: pwsh -ExecutionPolicy Bypass -File tool/stage_release.ps1 -Target android
      # 只上传 arm64 分包：另外两个 ABI（32 位 ARM / x86_64 模拟器）构建完直接丢弃，
      # 免得 Release 里三个 apk 让人挑错、下错还装不上（arm64 覆盖近十年的手机）
      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: releases/client-v${{ needs.version.outputs.version }}/*-arm64-v8a.apk
          if-no-files-found: error

  docker:
    name: 服务端 · 构建并推送镜像（amd64 + arm64）
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # runner 是 x86_64，要出 arm64 镜像得先装 QEMU 的 binfmt（模拟构建），
      # 否则 buildx 会直接报「no matching manifest for linux/arm64」
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          # 一次构建推一个多架构 manifest：拉镜像时 Docker 按机器架构自动选，
          # 树莓派 / 甲骨文 ARM 小鸡（部署目标里不少）因此不用另建一份 compose
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          # arm64 是模拟构建，依赖层很慢：用 Actions 缓存兜一下第二次之后的构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # latest 是 compose 默认引用的那个 tag（在线部署直接能用）；
          # 带版本号的 tag 用来固定版本、回滚（见 server/README 第十节）
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ needs.version.outputs.tag }}

  server-image:
    name: 服务端 · 导出离线镜像包
    needs: [version, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 确认 latest 已经是本次构建的多架构 manifest
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:latest" | tee /tmp/latest.txt
          for arch in amd64 arm64; do
            grep -q "linux/${arch}" /tmp/latest.txt || {
              echo "::error::${IMAGE}:latest 里没有 linux/${arch}，manifest 没推全"
              exit 1
            }
          done
      - name: 导出两个架构的 tar（镜像名固定 latest）
        run: |
          set -euo pipefail
          # 文件名与 server/README 的下载链接一致：omioclink-server-<版本>-<架构>.tar（版本不带 v）
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dist
          for arch in amd64 arm64; do
            docker pull --platform "linux/${arch}" "${IMAGE}:latest"
            # 只对能原生跑起来的 amd64 核对版本：arm64 要 QEMU 起容器，慢而且没必要——
            # 两个架构来自同一个 manifest，上面已经确认过
            if [ "$arch" = "amd64" ]; then
              got=$(docker run --rm --platform linux/amd64 "${IMAGE}:latest" python -c 'import app; print(app.__version__)')
              echo "镜像里的版本：$got，期望：$VERSION"
              if [ "$got" != "$VERSION" ]; then
                echo "::error::latest 里的版本是 $got，与 tag 对应的 $VERSION 不一致（可能是拉到了旧的 latest）"
                exit 1
              fi
            fi
            # docker save 会保留 tag：目标机 docker load 之后就是 omioc/omioclink:latest，
            # 正好对上两份 compose 里的默认值
            docker save "${IMAGE}:latest" -o "dist/omioclink-server-${VERSION}-${arch}.tar"
            ls -lh "dist/omioclink-server-${VERSION}-${arch}.tar"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: dist/*.tar
          if-no-files-found: error
          # 镜像层本身已经压缩过，再压一遍纯浪费时间
          compression-level: 0

  release:
    name: GitHub Release
    needs: [version, windows, android, server-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: server-image
          path: dist
      - name: 列出这次要发的文件
        run: ls -lh dist
      - name: 选发行说明
        run: |
          set -euo pipefail
          NOTES=".github/release-notes/${{ needs.version.outputs.tag }}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" body.md
            echo "用 $NOTES 作为发行说明"
          else
            PREV=$(git describe --tags --abbrev=0 "${{ needs.version.outputs.tag }}^" 2>/dev/null || true)
            {
              echo "# OmiocLink ${{ needs.version.outputs.tag }}"
              echo
              if [ -n "$PREV" ]; then
                echo "自 $PREV 以来的改动："
              else
                echo "改动："
              fi
              echo
              echo '```'
              if [ -n "$PREV" ]; then
                git log --oneline "$PREV".."${{ needs.version.outputs.tag }}"
              else
                git log --oneline -20
              fi
              echo '```'
            } > body.md
            echo "没有 .github/release-notes/${{ needs.version.outputs.tag }}.md，用提交列表代替"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: body.md
          files: dist/*
          fail_on_unmatched_files: true
