name: CI

# main 上每次 push、所有 PR 都跑：静态检查 + 单测 + 版本号漂移检查。
# 发版是另一条流水线（release.yml，由 tag 触发），这里不构建产物。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 client/README「环境要求」保持一致。runner 上装不到这个版本时，改成任一存在的 3.x 版本。
  FLUTTER_VERSION: "3.47.7"

jobs:
  client:
    name: 客户端 · analyze + test
    runs-on: ubuntu-latest
    # 正常 3~6 分钟；卡住别让它挂到 GitHub 默认的 6 小时
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 只给 flutter-version：走 SDK 压缩包（带缓存）。同时给 channel 会让 action
          # 退化成 git clone stable 分支再 checkout，在 runner 上能慢到十几分钟
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: 版本号一致性（pubspec → app_version.dart / Runner.rc）
        run: dart run tool/sync_version.dart --check
      - run: flutter analyze lib test
      - run: flutter test

  server:
    name: 服务端 · ruff + mypy + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
