<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/admin/logo.png">
<title data-i18n="appTitle">OmiocLink 管理</title>
<style>
  /* ---------------------------------------------------------------- 主题令牌
     浅色 / 暗色各一套。所有颜色只能从这里取：页面里不再出现写死的色值，
     否则换主题时总有一块留在另一套配色里。 */
  :root {
    --canvas: #f7f8fa;
    --surface: #ffffff;
    --surface-2: #f2f4f7;
    --surface-3: #e9edf1;
    --row-tint: rgba(16, 24, 40, .028);
    --head-tint: rgba(16, 24, 40, .045);
    --line: #e5e7eb;
    --line-soft: rgba(16, 24, 40, .07);
    --line-strong: #d6dae0;
    --ink: #14181d;
    --ink-2: #464f5a;
    --muted: #7c858f;
    --accent: #12a150;
    --accent-ink: #0b7a3b;
    --accent-soft: #e7f6ec;
    --danger: #c63c3c;
    --danger-soft: #fdecec;
    --warn: #a96a00;
    --warn-soft: #fdf3e2;
    --shadow: none;
    --shadow-sm: none;
    --rail: #ffffff;
  }
  html[data-theme="dark"] {
    --canvas: #0d1014;
    --surface: #141920;
    --surface-2: #1b222b;
    --surface-3: #232c36;
    --row-tint: rgba(255, 255, 255, .035);
    --head-tint: rgba(255, 255, 255, .055);
    --line: #232b35;
    --line-soft: rgba(255, 255, 255, .07);
    --line-strong: #2f3944;
    --ink: #e8ecf1;
    --ink-2: #b3bcc7;
    --muted: #7f8a97;
    --accent: #34d399;
    --accent-ink: #6ee7b7;
    --accent-soft: rgba(52, 211, 153, .13);
    --danger: #f27c7c;
    --danger-soft: rgba(242, 124, 124, .13);
    --warn: #e3a44a;
    --warn-soft: rgba(227, 164, 74, .13);
    --shadow: none;
    --shadow-sm: none;
    --rail: #12171e;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--canvas); color: var(--ink);
    font: 14px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    /* 页面本身永不滚动：内容区自己滚（见 .panel-body） */
    display: grid; grid-template-columns: 216px minmax(0, 1fr);
    height: 100dvh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-ink); }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    letter-spacing: .04em; font-variant-numeric: tabular-nums;
  }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  /* 输入框不画轮廓：聚焦只用底色区分（Chrome 对文本框连鼠标点击也算 focus-visible） */
  input:focus-visible, select:focus-visible { outline: none; }

  /* ------------------------------------------------------------------ 左栏 */
  .rail {
    background: var(--rail);
    display: flex; flex-direction: column; gap: 18px;
    padding: 18px 16px; min-height: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { width: 32px; height: 32px; border-radius: 9px; object-fit: cover; flex: none; }
  .brand-text { min-width: 0; flex: 1; }
  .brand-text b {
    display: block; font-size: 14px; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand-text span {
    display: block; font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .rail-block { display: grid; gap: 7px; font-size: 12px; color: var(--muted); }
  .rail-block .k { color: var(--muted); }
  .rail-block .v { color: var(--ink-2); font-weight: 600; }

  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.on .dot { background: var(--accent); }
  .status.off .dot { background: var(--danger); }


  /* ------------------------------------------------------------------ 按钮 */
  /* 普通按钮：有底色、小圆角；只有「幽灵」变体才不铺底色 */
  button {
    font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1px solid transparent; border-radius: 5px;
    height: 32px; padding: 0 12px; gap: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s, color .15s;
  }
  button:hover:not(:disabled) { background: var(--surface-3); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  html[data-theme="dark"] button.primary { color: #06170f; }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.06); }
  button.danger { color: var(--danger); }
  button.danger:hover:not(:disabled) { background: var(--danger-soft); }
  button.ghost { background: transparent; color: var(--ink-2); }
  button.ghost:hover:not(:disabled) { background: var(--surface-2); }
  button.small { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 5px; }
  button svg { width: 14px; height: 14px; display: block; }
  .icon-btn {
    width: 32px; height: 32px; padding: 0; display: inline-grid; place-items: center;
    font-size: 15px; line-height: 1;
  }

  input[type=text], input[type=password], input[type=search], select {
    font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1px solid transparent; border-radius: 5px;
    height: 32px; padding: 0 11px; min-width: 0;
    transition: background .15s, box-shadow .15s;
  }
  /* 聚焦只把底色压深一档：不加描边，靠色差把输入框和卡片分开 */
  input:focus, select:focus {
    background: var(--surface-3);
  }
  input::placeholder { color: var(--muted); }
  /* 搜索框的「清空」：浏览器自带的叉用系统强调色（各家还不一样），
     直接藏掉，用下面 .search-clear 自己画一个主题色的。 */
  input[type="search"]::-webkit-search-cancel-button,
  input[type="search"]::-webkit-search-decoration {
    -webkit-appearance: none; appearance: none; display: none;
  }
  .search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; padding: 0; border: none; background: transparent;
    border-radius: 5px; display: none; place-items: center; color: var(--accent);
  }
  .search-clear[data-visible="true"] { display: grid; }
  .search-clear:hover:not(:disabled) { background: var(--line-soft); }
  .search-clear svg { width: 13px; height: 13px; display: block; }

  /* -------------------------------------------------------------- 主内容区 */
  .main {
    display: grid; grid-template-rows: auto auto auto minmax(0, 1fr);
    gap: 14px; padding: 18px 22px 16px; min-width: 0; min-height: 0;
  }
  .page-head { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .head-titles { min-width: 0; }
  .page-head h1 { font-size: 20px; margin: 0; letter-spacing: -.015em; }
  .page-head p { margin: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 提示放在标题行的空白处：出现在那一行里，不额外占一整行高度 */
  .head-notice { flex: 1 1 0; min-width: 0; display: flex; justify-content: flex-end; }
  .head-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; flex: none; }
  .whoami {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--ink-2);
    max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .whoami::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); flex: none;
  }

  /* 统计：四张各自独立的小卡片（没有共用边框、也没有中间的竖线） */
  .stats {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }
  .stat {
    padding: 11px 13px; min-width: 0;
    background: var(--surface); border-radius: 13px;
  }
  .stat-top { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; }
  .stat-top .mark { width: 5px; height: 5px; border-radius: 2px; background: var(--line-strong); }
  .stat-top .mark.live { background: var(--accent); }
  .stat-body { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 3px; }
  .stat-body > div:first-child { min-width: 0; }
  .stat-value {
    font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .stat-sub {
    color: var(--muted); font-size: 11px; margin-top: 1px; min-height: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .spark { width: 54px; height: 22px; flex: none; overflow: visible; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .spark.empty polyline { display: none; }

  /* ------------------------------------------------------------------ 页签 */
  .tabs {
    display: inline-flex; gap: 2px; padding: 3px;
    /* grid 子项默认拉伸到整行：这里只按三个页签的内容宽度铺开 */
    justify-self: start;
    background: var(--surface-2); border-radius: 11px;
  }
  .tab {
    border: none; background: transparent; color: var(--ink-2);
    padding: 7px 16px; border-radius: 5px; font-size: 13px; font-weight: 600;
  }
  .tab:hover:not([aria-selected="true"]) { background: var(--surface); }
  .tab[aria-selected="true"] {
    background: var(--surface); color: var(--ink);
  }
  .tab .count {
    margin-left: 6px; font-weight: 600; font-size: 11.5px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ------------------------------------------------------ 面板（各页签主体） */
  .panel {
    display: none; min-height: 0; flex-direction: column;
    background: var(--surface); border-radius: 16px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .panel[data-active="true"] { display: flex; }
  .panel-toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 14px 20px; min-height: 56px; background: var(--surface);
  }
  .panel-toolbar .spacer { flex: 1; }
  .search-field {
    position: relative; display: inline-flex; align-items: center;
    flex: 0 1 240px; min-width: 160px;
  }
  .search-field .search-icon {
    position: absolute; left: 10px; display: grid; place-items: center;
    color: var(--muted); pointer-events: none;
  }
  .search-field .search-icon svg { width: 14px; height: 14px; display: block; }
  .search-field input { width: 100%; padding-left: 32px; padding-right: 30px; }
  #newUserBtn { display: inline-flex; align-items: center; gap: 6px; }
  #newUserBtn svg { width: 14px; height: 14px; }
  .panel-body { flex: 1; min-height: 0; overflow: auto; padding: 8px 20px 12px; }
  /* 窄屏先丢次要列，避免表格横向溢出（页面本身永远不滚） */
  @media (max-width: 1080px) { .hide-md { display: none; } }
  .panel-foot {
    display: flex; align-items: center; gap: 10px; padding: 12px 20px;
    color: var(--muted); font-size: 12.5px;
  }
  .panel-foot .spacer { flex: 1; }
  /* 工具条里的单行说明：不换行、超长省略，保证三个页签的工具条一样高 */
  .hint-line { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 分页：圆角方块页码，当前页填充强调色 */
  .pager { display: inline-flex; align-items: center; gap: 4px; }
  .page-btn {
    min-width: 28px; height: 28px; padding: 0 8px; border: none;
    background: var(--surface-2); color: var(--ink-2);
    border-radius: 5px; font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .page-btn:hover:not(:disabled):not(.active) { background: var(--line-soft); }
  .page-btn.active { background: var(--accent); color: #fff; }
  html[data-theme="dark"] .page-btn.active { color: #06170f; }
  .page-btn:disabled { opacity: .4; cursor: not-allowed; }
  .page-gap { color: var(--muted); font-size: 12px; padding: 0 2px; }

  /* ------------------------------------------------------------------ 表格 */
  /* 表头是一条浅色带、行与行之间靠斑马纹区分（没有分割线），操作是行尾的图标 */
  table {
    width: 100%; margin: 0;
    border-collapse: separate; border-spacing: 0;
  }
  thead th {
    position: sticky; top: 0; z-index: 1;
    text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted);
    background: var(--head-tint); padding: 10px 16px; white-space: nowrap;
  }
  /* 表体左右已是 20px 面板内边距：色带就从这条边界起，首列收回 6px 免得文字跟着往里缩 */
  thead th:first-child { padding-left: 14px; border-radius: 10px 0 0 10px; }
  thead th:last-child { border-radius: 0 10px 10px 0; }
  tbody td {
    padding: 12px 16px; font-size: 13px; vertical-align: middle; white-space: nowrap;
    border: none;
  }
  tbody td:first-child { padding-left: 14px; }
  /* 斑马纹从第二行开始：第一行留白，和第二行交替，看起来更像「一条条」的行 */
  tbody tr:nth-child(even) td { background: var(--row-tint); }
  tbody tr:hover td { background: var(--head-tint); }
  /* 每行首尾切角：一条条圆角色带（白底行看不出来，斑马行和悬停行才显形） */
  tbody tr td:first-child { border-radius: 10px 0 0 10px; }
  tbody tr td:last-child { border-radius: 0 10px 10px 0; }
  td.actions { text-align: right; white-space: nowrap; }
  thead th.actions { text-align: right; }
  /* 行尾操作：无边框的图标按钮，悬停才上底色 */
  .icon-action {
    width: 28px; height: 28px; padding: 0; border: none; background: transparent;
    border-radius: 5px; display: inline-grid; place-items: center; vertical-align: middle;
    color: var(--ink-2);
  }
  .icon-action + .icon-action { margin-left: 2px; }
  .icon-action:hover:not(:disabled) { background: var(--line-soft); }
  .icon-action.danger { color: var(--danger); }
  .icon-action.danger:hover:not(:disabled) { background: var(--danger-soft); }
  .icon-action svg { width: 15px; height: 15px; display: block; }
  /* 启用（绿）/ 禁用（灰）用两个不同的图标，光看图标就知道点下去会发生什么 */
  .icon-action.accent { color: var(--accent); }
  .strong { font-weight: 600; }
  .dim { color: var(--muted); }
  /* 账号列里「#编号」在前、用户名在后：编号占固定宽度，用户名首字才对齐
     （40px 够 #9999 这种 4 位数，再宽也不会把后面的名字推歪） */
  .uid {
    display: inline-block; min-width: 40px; margin-right: 10px;
    color: var(--muted); font-size: 12px;
  }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 1px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    background: var(--surface-2); color: var(--ink-2);
    /* 抵消左右内边距：胶囊里的文字与表头文字落在同一条左边界上 */
    margin-left: -9px;
  }
  .pill.on { background: var(--accent-soft); color: var(--accent-ink); }
  .pill.off { background: var(--danger-soft); color: var(--danger); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }

  /* 自绘下拉：触发器 + 展开列表都用主题样式，原生 <select> 的列表改不动 */
  .select {
    position: relative; display: inline-flex; align-items: center; gap: 5px;
    height: 28px; padding: 0 8px 0 10px; border-radius: 5px;
    background: var(--surface-2); color: var(--ink-2);
    font-size: 12.5px; cursor: pointer; user-select: none;
  }
  .select:hover { background: var(--surface-3); }
  .select-value { font-variant-numeric: tabular-nums; }
  .select-caret { width: 12px; height: 12px; }
  .select-menu {
    position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 20;
    min-width: 88px; padding: 4px; display: grid; gap: 2px;
    background: var(--surface-2); border-radius: 10px;
  }
  html[data-theme="dark"] .select-menu { background: var(--surface-3); }
  .select-menu[hidden] { display: none; }
  .select-option {
    width: 100%; height: 28px; padding: 0 12px; border: none; background: transparent;
    border-radius: 5px; justify-content: flex-start; color: var(--ink-2);
    font-size: 12.5px; font-variant-numeric: tabular-nums;
  }
  .select-option:hover:not(:disabled) { background: var(--surface-3); }
  html[data-theme="dark"] .select-option:hover:not(:disabled) { background: var(--surface-2); }
  .select-option[aria-selected="true"] { color: var(--accent-ink); font-weight: 600; }

  /* 语言菜单：外观复用 .select-menu，但它挂在头部按钮下方，所以改成向下弹 */
  .lang-wrap { position: relative; display: inline-flex; }
  .lang-wrap .select-menu { top: calc(100% + 6px); bottom: auto; min-width: 168px; }
  /* 韩语的「시스템 설정 따르기」是最长的一项，宽度按它给，其余语言都放得下 */
  .lang-wrap .select-option { white-space: nowrap; }

  .code {
    display: inline-block; padding: 1px 7px; border-radius: 6px;
    background: var(--surface-2); font-size: 12px;
  }
  .meter { width: 52px; height: 5px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
  .cell-inline { display: inline-flex; align-items: center; gap: 8px; }

  .empty { padding: 34px 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .empty b { display: block; color: var(--ink-2); font-size: 13.5px; margin-bottom: 4px; }

  /* ------------------------------------------------------------------ 其它 */
  .hint { color: var(--muted); font-size: 12px; line-height: 1.7; }
  .hint code, .mono-box {
    font-family: ui-monospace, Consolas, monospace; font-size: 11.5px;
    background: var(--surface-2);
    padding: 1px 5px; border-radius: 5px;
  }
  #banner {
    display: none; padding: 5px 11px; border-radius: 8px; font-size: 12px;
    background: var(--danger-soft); color: var(--danger);
    max-width: min(46vw, 460px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #banner.ok { background: var(--accent-soft); color: var(--accent-ink); }

  .switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; font-size: 12.5px; color: var(--ink-2); }
  .switch input { display: none; }
  .track { width: 38px; height: 21px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background .15s; flex: none; }
  .track::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px;
    border-radius: 50%; background: #fff; transition: left .15s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { left: 20px; }

  dialog {
    border: none; border-radius: 18px; padding: 20px 22px;
    background: var(--surface); color: var(--ink); width: min(640px, 92vw);
    max-height: min(86dvh, 720px);
  }
  dialog::backdrop { background: rgba(9, 13, 18, .55); backdrop-filter: blur(2px); }
  dialog h3 { margin: 0 0 14px; font-size: 15.5px; letter-spacing: -.01em; }
  dialog .body { max-height: min(64dvh, 560px); overflow: auto; }
  dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .field { display: grid; gap: 5px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input { width: 100%; }
  .grid-form { display: grid; gap: 12px; }
  .form-error { color: var(--danger); font-size: 12px; min-height: 18px; padding-top: 8px; }
  .warn-box {
    display: none; margin: 0 0 14px; padding: 10px 12px; border-radius: 10px;
    font-size: 12px; line-height: 1.7; background: var(--warn-soft); color: var(--warn);
  }
  .sub-row { display: flex; gap: 8px; align-items: center; }
  .sub-row input { flex: 1; }
  .sub-index { width: 22px; color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }

  /* 细滚动条：只在表格体里出现，看起来是「面板在滚」而不是页面在滚 */
  .panel-body, dialog .body { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .panel-body::-webkit-scrollbar, dialog .body::-webkit-scrollbar { width: 9px; height: 9px; }
  .panel-body::-webkit-scrollbar-thumb, dialog .body::-webkit-scrollbar-thumb {
    background: var(--line-strong); border-radius: 999px; border: 2px solid var(--surface);
  }

  @media (max-width: 900px) {
    body { grid-template-columns: minmax(0, 1fr); }
    .rail { display: none; }
    .main { padding: 14px; gap: 11px; }

<aside class="rail">

  <div class="rail-block">

<main class="main">

    <div class="head-notice" id="banner"></div>
    <div class="head-actions">
      <span class="whoami" id="whoami" style="display: none"></span>
      <div class="lang-wrap">
        <button class="icon-btn ghost" id="langBtn" title="切换语言" data-i18n-title="langSwitch" aria-label="切换语言" data-i18n-aria="langSwitch" aria-haspopup="true" aria-expanded="false">中</button>
        <div class="select-menu" id="langMenu" hidden></div>
      </div>
      <button class="icon-btn ghost" id="themeBtn" title="切换浅色 / 深色" data-i18n-title="themeTitle" aria-label="切换主题" data-i18n-aria="themeAria">◐</button>
      <button class="ghost small" id="changePasswordBtn" style="display: none"><span data-i18n="authChangePassword">修改密码</span></button>
      <button class="ghost small" id="logoutBtn" style="display: none"><span data-i18n="authLogout">退出登录</span></button>
      <button class="icon-btn ghost" id="refreshBtn" title="立即刷新" data-i18n-title="refreshTitle" aria-label="立即刷新" data-i18n-aria="refreshAria">⟳</button>
    </div>
  </div>

  <section class="stats" id="stats"></section>

  <div class="tabs" role="tablist" aria-label="管理区块" data-i18n-aria="tabsAria">
    <button class="tab" id="tab-accounts" role="tab" aria-selected="true" aria-controls="panel-accounts" data-tab="accounts">
      <span data-i18n="tabAccounts">账号</span><span class="count" id="countAccounts"></span>
    </button>
    <button class="tab" id="tab-rooms" role="tab" aria-selected="false" aria-controls="panel-rooms" data-tab="rooms">
      <span data-i18n="tabRooms">房间</span><span class="count" id="countRooms"></span>

    <button class="tab" id="tab-plugins" role="tab" aria-selected="false" aria-controls="panel-plugins" data-tab="plugins">
      <span data-i18n="tabPlugins">插件</span>
    </button>
  </div>

  <!-- 账号 -->
  <section class="panel" id="panel-accounts" role="tabpanel" aria-labelledby="tab-accounts" data-active="true">
    <div class="panel-toolbar">
      <label class="search-field" title="按用户名或昵称搜索，回车确认" data-i18n-title="searchTitle">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M16 16l4.5 4.5"></path></svg>
        </span>
        <input type="search" id="userQuery" placeholder="按用户名或昵称搜索" data-i18n-placeholder="searchPlaceholder">
        <button type="button" class="search-clear" id="userQueryClear" aria-label="清空搜索" data-i18n-aria="searchClear" data-visible="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </label>
      <div class="spacer"></div>
      <label class="switch" title="重启容器后回到 .env 里的 OMIOCLINK_ALLOW_REGISTRATION" data-i18n-title="regToggleTitle">

        <span class="track"></span>
        <span id="registrationLabel" data-i18n="regLabel">自助注册</span>
      </label>
      <button class="primary" id="newUserBtn">

        <span data-i18n="newAccount">新建账号</span>
      </button>
    </div>
    <div class="panel-body" id="users"></div>
    <div class="panel-foot">
      <span id="usersSummary" class="dim">—</span>
      <div class="spacer"></div>

      <div class="pager" id="usersPager"></div>
    </div>
  </section>

  <!-- 房间 -->
  <section class="panel" id="panel-rooms" role="tabpanel" aria-labelledby="tab-rooms">
    <div class="panel-toolbar">
      <span class="hint hint-line" data-i18n="roomsHint">有人的房间排在前面，成员数实时刷新</span>

      <div class="spacer"></div>

      <div class="pager" id="roomsPager"></div>
    </div>
  </section>

      <span id="pluginsSummary" class="dim">—</span>
      <div class="spacer"></div>
      <div class="hint" data-i18n="perPage">每页</div>

      <div class="pager" id="pluginsPager"></div>

</dialog>

<dialog id="newUserDialog">

const LANG_KEY = 'omioclink.adminLang';
// 「跟随系统」也是一个可选值：没选过语言时，系统语言变了页面要跟着变
const LANGS = [
  { code: 'auto', label: 'langAuto' },
  { code: 'zh', label: 'langZh' },
  { code: 'en', label: 'langEn' },
  { code: 'ja', label: 'langJa' },
  { code: 'ko', label: 'langKo' },
];
// <html lang> 与请求头 Accept-Language 用同一套标签
const LANG_TAG = { zh: 'zh-CN', en: 'en', ja: 'ja', ko: 'ko' };
// 语言按钮是 32×32 的 .icon-btn，只放得下两个字符以内的短标记
const LANG_BADGE = { zh: '中', en: 'EN', ja: '日', ko: '한' };

let langPref = 'auto';
let lang = 'zh';
// 切语言要原地重画而不是重新请求：各块最近一次拿到的数据和最近一次状态都留一份
let lastOverview = null;
let lastAccounts = null;
let lastRooms = null;
let membersData = null;
let loggedInUser = null;
let lastStatus = null;

function t(key, params) {
  const table = I18N[lang] || I18N.zh;
  let text = table[key];
  if (text === undefined) text = I18N.zh[key];
  if (text === undefined) return key;
  if (params) {
    text = text.replace(/\{(\w+)\}/g, (whole, name) => (
      params[name] === undefined ? whole : String(params[name])
    ));
  }
  return text;
}

// 少数文案带运行时才知道的参数（密码最小长度由服务端给），统一在这里取
const I18N_PARAMS = {
  pwdMin: () => ({ min: passwordMinLength }),
  pwdMinNew: () => ({ min: passwordMinLength }),
};

function i18nParams(key) {
  return I18N_PARAMS[key] ? I18N_PARAMS[key]() : undefined;
}

// 静态文案：data-i18n 写 textContent，data-i18n-title / -placeholder / -aria 写对应属性。
// 带图标的按钮把文字包在 <span data-i18n> 里，否则 textContent 会把图标一起冲掉。
function applyStaticTexts() {
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    el.textContent = t(key, i18nParams(key));
  });
  [['data-i18n-title', 'title'], ['data-i18n-placeholder', 'placeholder'], ['data-i18n-aria', 'aria-label']]
    .forEach(([attr, target]) => {
      document.querySelectorAll('[' + attr + ']').forEach((el) => {
        const key = el.getAttribute(attr);
        el.setAttribute(target, t(key, i18nParams(key)));
      });
    });
}

function acceptLanguage() {
  return LANG_TAG[lang];
}

// 没选过语言时跟浏览器走，认不出就用中文
function detectLang() {
  const tag = (navigator.language || '').toLowerCase().slice(0, 2);
  return LANG_TAG[tag] ? tag : 'zh';
}

function renderLangMenu() {
  $('langMenu').innerHTML = LANGS.map((item) => (
    `<button type="button" class="select-option" data-lang="${item.code}" aria-selected="${item.code === langPref}">${esc(t(item.label))}</button>`
  )).join('');
}

function applyLanguage() {
  document.documentElement.lang = LANG_TAG[lang];
  $('langBtn').textContent = LANG_BADGE[lang];
  applyStaticTexts();
  renderLangMenu();
}

// 表格行、分页、页签数字都是按数据画出来的：切语言时拿同一份数据重画，不重新请求
function redrawTexts() {
  if (lastOverview) drawOverview(lastOverview);
  if (lastAccounts) renderAccounts(lastAccounts);
  if (lastRooms) renderRooms(lastRooms);
  renderPlugins();
  if (currentRoomId && membersData) renderMembers();
  setLoggedIn(loggedInUser);
  if (lastStatus) setStatus(lastStatus.ok, lastStatus.key);
  // 还挂着的提示条是上一种语言下生成的一次性消息，留着会两种语言混排
  clearTimeout(banner._t);
  $('banner').style.display = 'none';
}

function setLangPref(pref) {
  langPref = (pref === 'auto' || LANG_TAG[pref]) ? pref : 'auto';
  lang = langPref === 'auto' ? detectLang() : langPref;
  localStorage.setItem(LANG_KEY, langPref);
  applyLanguage();
  redrawTexts();
}

function closeLangMenu() {
  $('langMenu').hidden = true;
  $('langBtn').setAttribute('aria-expanded', 'false');
}

$('langBtn').addEventListener('click', () => {
  const menu = $('langMenu');
  menu.hidden = !menu.hidden;
  $('langBtn').setAttribute('aria-expanded', String(!menu.hidden));
});
$('langMenu').addEventListener('click', (event) => {
  const option = event.target.closest('[data-lang]');
  if (!option) return;
  closeLangMenu();
  setLangPref(option.dataset.lang);
});
// 点空白处 / 按 Esc 收起，跟分页下拉的行为保持一致
document.addEventListener('click', (event) => {
  if (!$('langMenu').hidden && !document.querySelector('.lang-wrap').contains(event.target)) closeLangMenu();
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeLangMenu();
});

(function initLang() {
  const saved = localStorage.getItem(LANG_KEY) || 'auto';
  langPref = (saved === 'auto' || LANG_TAG[saved]) ? saved : 'auto';
  lang = langPref === 'auto' ? detectLang() : langPref;
  applyLanguage();
})();

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;

(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'light'));
})();

});

// ------------------------------------------------------------------ 全局提示
function banner(msg, ok = false) {
  const el = $('banner');
  if (!msg) { el.style.display = 'none'; return; }
  el.textContent = msg;
  el.className = ok ? 'ok' : '';
  el.style.display = 'block';
  clearTimeout(banner._t);
  banner._t = setTimeout(() => { el.style.display = 'none'; }, 6000);
}

function setStatus(ok, key) {
  lastStatus = { ok, key };
  $('status').className = 'status ' + (ok ? 'on' : 'off');
  $('statusText').textContent = t(key);
}

function setLoggedIn(username) {
  loggedInUser = username || null;
  const on = !!username;
  $('whoami').style.display = on ? 'inline-flex' : 'none';
  $('whoami').textContent = on ? t('whoamiOn', { user: username }) : '';
  $('whoami').title = on ? t('whoamiTitle', { user: username }) : '';
  $('changePasswordBtn').style.display = on ? 'inline-block' : 'none';
  $('logoutBtn').style.display = on ? 'inline-block' : 'none';
  $('changePasswordBtn').disabled = !on;
  $('logoutBtn').disabled = !on;
}

function saveToken(value) {
  token = value || '';
  if (token) localStorage.setItem(TOKEN_KEY, token);
  else localStorage.removeItem(TOKEN_KEY);
}

function stopPolling() {
  clearInterval(timer);
  timer = null;
}

function startPolling() {
  stopPolling();
  // 只刷「概览 + 当前页签」，比原来每 10 秒把三块全拉一遍省下三分之二的请求
  timer = setInterval(() => { refresh({ silent: true }); }, 10000);
}

// 管理接口统一走 Authorization: Bearer；旧版的 X-Admin-Token 已废弃，前端不再发
async function api(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: {
      // 服务端的错误消息是按 Accept-Language 出的，界面语言变了请求头也跟着变
      'Accept-Language': acceptLanguage(),
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
      ...(options.body ? { 'Content-Type': 'application/json' } : {}),
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) {
    setStatus(false, 'statusExpired');
    handleUnauthorized(t('unauthorized'));
    throw new Error('unauthorized');
  }
  if (res.status === 204) return null;
  const body = await res.json().catch(() => null);
  if (!res.ok) { banner(body && body.message ? body.message : ('HTTP ' + res.status)); throw new Error('api'); }
  return body;
}

// 免鉴权的两个接口（设置密码 / 登录）：密码错了要留在弹窗里提示，不能像 api() 那样跳登录框
async function postPublic(path, body) {
  const res = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept-Language': acceptLanguage() },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const err = new Error(data && data.message ? data.message : ('HTTP ' + res.status));
    err.code = data ? data.code : '';
    throw err;
  }
  return data;
}

function handleUnauthorized(reason) {
  stopPolling();
  saveToken('');
  setLoggedIn(null);
  if (reason) banner(reason);
  // 重新问一次服务器：可能是在别的浏览器里刚设过密码，也可能只是登录过期
  if (!reauthing) boot();
}

async function boot() {
  reauthing = true;
  let status = null;
  try {
  const res = await fetch(API + '/session', {
    headers: {
      'Accept-Language': acceptLanguage(),
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
    },
  });
    status = await res.json();
  } catch (e) {
    setStatus(false, 'statusOffline');
    banner(t('bootOffline'));
    reauthing = false;
    return;
  }
  passwordMinLength = status.passwordMinLength || 8;
  // 两个密码标签带着最小长度，这个数服务端才知道：拿到后把带参文案重套一遍
  applyStaticTexts();
  reauthing = false;

  if (!status.initialized) {
    setStatus(false, 'statusNoPassword');
    setLoggedIn(null);
    showSetup(status.legacyTokenConfigured);
    return;
  }
  if (!status.authenticated) {
    setStatus(false, 'statusLoggedOut');
    setLoggedIn(null);
    showLogin();
    return;
  }
  setStatus(true, 'statusConnected');
  setLoggedIn(status.username || 'admin');
  await refresh();
  startPolling();
}

function showSetup(legacyConfigured) {
  const hint = $('legacyHint');
  if (legacyConfigured) {
    // 令牌名是代码标识不翻译，各语言语序不同，所以拆成前后两段把它夹在中间
    hint.innerHTML = esc(t('setupLegacyA')) + '<span class="mono-box">OMIOCLINK_ADMIN_TOKEN</span>'
      + esc(t('setupLegacyB'));
    hint.style.display = 'block';
  } else {
    hint.style.display = 'none';
  }
  $('setupError').textContent = '';
  $('setupPassword').value = '';
  $('setupPassword2').value = '';
  if (!$('setupDialog').open) $('setupDialog').showModal();
  $('setupPassword').focus();
}

function showLogin() {
  $('loginError').textContent = '';
  $('loginPassword').value = '';
  if ($('setupDialog').open) $('setupDialog').close();
  if (!$('loginDialog').open) $('loginDialog').showModal();
  $('loginPassword').focus();
}

function afterLogin(result, message) {
  saveToken(result.accessToken);
  ['setupDialog', 'loginDialog'].forEach((id) => { if ($(id).open) $(id).close(); });
  banner(message, true);
  boot();
}

const state = {
  tab: 'accounts',
  accounts: { page: 1, size: 20, query: '', total: 0, loaded: false },
  rooms: { page: 1, size: 20, total: 0, loaded: false },
  plugins: { page: 1, size: 5 },
};

function pagesOf(section) {
  return Math.max(1, Math.ceil((section.total || 0) / section.size));
}

function setTab(name) {
  state.tab = name;
  document.querySelectorAll('.tab').forEach((btn) => {
    btn.setAttribute('aria-selected', String(btn.dataset.tab === name));
  });
  document.querySelectorAll('.panel').forEach((panel) => {
    panel.dataset.active = String(panel.id === 'panel-' + name);
  });
  // 切页签时才去拉这一块：首屏不再把三块全要一遍
  const section = state[name] || {};
  if (name === 'plugins') { loadPlugins(); return; }
  if (!section.loaded) { name === 'accounts' ? loadAccounts() : loadRooms(); return; }
  refresh();
}

document.querySelectorAll('.tab').forEach((btn) => {
  btn.addEventListener('click', () => setTab(btn.dataset.tab));
});
document.querySelectorAll('[role="tablist"]').forEach((list) => {
  list.addEventListener('keydown', (event) => {
    if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
    const tabs = Array.from(list.querySelectorAll('.tab'));
    const index = tabs.findIndex((t) => t.getAttribute('aria-selected') === 'true');
    const next = tabs[(index + (event.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    next.focus(); next.click();
  });
});

// ------------------------------------------------------------------ 概览与迷你折线
// 只留最近 24 个采样（10 秒一个 ≈ 4 分钟），够看出「刚才是有人在的」就行。
const spark = { peer: [], rooms: [] };
function pushSample(series, value) {
  series.push(Number(value) || 0);
  if (series.length > 24) series.shift();
}
function sparkSvg(series) {
  if (series.length < 2) return '<svg class="spark empty" viewBox="0 0 120 32" preserveAspectRatio="none"></svg>';
  // 按「区间」缩放而不是按最大值：全是同一个数时画成中间那条横线，
  // 否则 0→0 或 5→5 这种平稳数据会被画到框顶，看着像缺失。
  const min = Math.min(...series);
  const max = Math.max(...series);
  const span = max - min;
  const step = 120 / (series.length - 1);
  const yOf = (v) => (span === 0 ? 16 : 26 - ((v - min) / span) * 20);
  const points = series
    .map((v, i) => `${(i * step).toFixed(1)},${yOf(v).toFixed(1)}`)
    .join(' ');
  return `<svg class="spark" viewBox="0 0 120 32" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${points}" /></svg>`;
}

function statCard({ label, value, sub, live, svg }) {
  return `<div class="stat">
    <div class="stat-top"><span class="mark ${live ? 'live' : ''}"></span>${esc(label)}</div>
    <div class="stat-body">
      <div>
        <div class="stat-value">${esc(value)}</div>
        <div class="stat-sub">${esc(sub || '')}</div>
      </div>
      ${svg || ''}
    </div>
  </div>`;
}

function renderOverview(o) {
  lastOverview = o;
  pushSample(spark.peer, o.livePeerCount);
  pushSample(spark.rooms, o.liveRoomCount);
  drawOverview(o);
}

// 只画、不记采样：切语言时拿同一份数据重画，不能让折线被同一个数重复挤歪
function drawOverview(o) {
  $('stats').innerHTML = [
    statCard({ label: t('tabAccounts'), value: o.userCount, sub: t('statAccountsSub') }),
    statCard({ label: t('tabRooms'), value: o.roomCount, sub: t('statRoomsSub', { n: o.publicRoomCount ?? 0 }) }),
    statCard({ label: t('statPeers'), value: o.livePeerCount, live: true, svg: sparkSvg(spark.peer) }),
    statCard({ label: t('statLiveRooms'), value: o.liveRoomCount, live: true, svg: sparkSvg(spark.rooms) }),
  ].join('');

  $('registrationToggle').checked = !!o.allowRegistration;
  $('registrationLabel').textContent = o.allowRegistration ? t('regOn') : t('regOff');
  $('serverName').textContent = o.serverName || 'OmiocLink';
  $('serverVersion').textContent = 'v' + (o.version || '—');
  $('countAccounts').textContent = o.userCount;
  $('countRooms').textContent = o.roomCount;
  $('headline').textContent = t('headHeadline', {
    users: o.userCount, rooms: o.roomCount, peers: o.livePeerCount, live: o.liveRoomCount,
  });
}

// ------------------------------------------------------------------ 账号
function renderAccounts(data) {
  lastAccounts = data;
  const section = state.accounts;
  section.total = data.total || 0;
  const page = Math.min(section.page, pagesOf(section));
  if (page !== section.page) { section.page = page; loadAccounts(); return; }

  if (!data.items.length) {
    $('users').innerHTML = section.query
      ? `<div class="empty"><b>${esc(t('accountsEmptySearchTitle'))}</b>${esc(t('accountsEmptySearchBody'))}</div>`
      : `<div class="empty"><b>${esc(t('accountsEmptyTitle'))}</b>${esc(t('accountsEmptyBody'))}</div>`;
  } else {
    $('users').innerHTML = `<table><thead><tr>
        <th scope="col">${esc(t('tabAccounts'))}</th><th scope="col">${esc(t('colNickname'))}</th><th scope="col">${esc(t('colStatus'))}</th>
        <th scope="col" class="hide-md">${esc(t('colCreatedAt'))}</th><th scope="col" class="actions">${esc(t('colActions'))}</th>
      </tr></thead><tbody>${data.items.map((u) => `
      <tr>
        <td><span class="uid num">#${u.id}</span><span class="strong">${esc(u.username)}</span></td>
        <td>${esc(u.displayName || '—')}</td>
        <td>${u.disabled
          ? `<span class="pill off">${esc(t('userDisabled'))}</span>`
          : (u.online ? `<span class="pill on">${esc(t('userOnline'))}</span>` : `<span class="pill">${esc(t('userOffline'))}</span>`)}</td>
        <td class="dim hide-md">${u.createdAt ? esc(new Date(u.createdAt).toLocaleString(LANG_TAG[lang])) : '—'}</td>
        <td class="actions">
          <button class="icon-action${u.disabled ? ' accent' : ''}" data-toggle="${u.id}" data-disabled="${u.disabled}" title="${t(u.disabled ? 'userEnableTitle' : 'userDisableTitle')}">${u.disabled ? ICON.check : ICON.ban}</button>
          <button class="icon-action danger" data-delete="${u.id}" title="${t('userDeleteTitle')}">${ICON.trash}</button>
        </td>
      </tr>`).join('')}</tbody></table>`;
  }
  $('usersSummary').textContent = section.query
    ? t('accountsSummarySearch', { q: section.query, n: section.total })
    : t('accountsSummary', { n: section.total });
  renderPager('usersPager', section, pagesOf(section), loadAccounts);
  bindAccountActions();
}

function bindAccountActions() {
  $('users').querySelectorAll('[data-toggle]').forEach((btn) =>
    btn.addEventListener('click', async () => {
      const id = Number(btn.dataset.toggle);
      const wasDisabled = btn.dataset.disabled === 'true';
      // 禁用会把在线的人踢下线，确认框里要单独提醒；启用则不必
      const extra = wasDisabled ? '' : t('userDisableWarning');
      const ask = wasDisabled ? 'userEnableConfirm' : 'userDisableConfirm';
      if (!confirm(t(ask, { id }) + extra)) return;
      await api('/users/' + id, { method: 'PATCH', body: JSON.stringify({ disabled: !wasDisabled }) });
      banner(t(wasDisabled ? 'userEnabled' : 'userDisabledBanner', { id }), true);
      await refresh();
    }));

  $('users').querySelectorAll('[data-delete]').forEach((btn) =>
    btn.addEventListener('click', async () => {
      const id = Number(btn.dataset.delete);
      if (!confirm(t('userDeleteConfirm', { id }) + '\n\n' + t('userDeleteWarning'))) return;
      await api('/users/' + id, { method: 'DELETE' });
      banner(t('userDeleted', { id }), true);
      await refresh();
    }));
}

async function loadAccounts() {
  const section = state.accounts;
  section.query = $('userQuery').value.trim();
  const offset = (section.page - 1) * section.size;
  const params = new URLSearchParams({ limit: String(section.size), offset: String(offset) });
  if (section.query) params.set('query', section.query);
  const data = await api('/users?' + params.toString());
  section.loaded = true;
  renderAccounts(data);
}

// ------------------------------------------------------------------ 房间
function renderRooms(data) {
  lastRooms = data;
  const section = state.rooms;
  section.total = data.total || 0;
  const page = Math.min(section.page, pagesOf(section));
  if (page !== section.page) { section.page = page; loadRooms(); return; }

  if (!data.items.length) {
    $('rooms').innerHTML = `<div class="empty"><b>${esc(t('roomsEmptyTitle'))}</b>${esc(t('roomsEmptyBody'))}</div>`;
  } else {
    $('rooms').innerHTML = `<table><thead><tr>
        <th scope="col">${esc(t('tabRooms'))}</th><th scope="col">${esc(t('colRoomId'))}</th><th scope="col">${esc(t('colMembers'))}</th>
        <th scope="col">${esc(t('colOwner'))}</th><th scope="col" class="hide-md">${esc(t('colAttrs'))}</th><th scope="col" class="actions">${esc(t('colActions'))}</th>
      </tr></thead><tbody>${data.items.map((r) => {
        const ratio = r.capacity ? Math.min(100, Math.round((r.memberCount / r.capacity) * 100)) : 0;
        return `
      <tr>
        <td><span class="strong">${esc(r.name)}</span> ${r.online ? `<span class="pill on">${esc(t('roomLive'))}</span>` : ''}</td>
        <td><span class="code mono">${esc(r.roomId)}</span></td>
        <td><span class="cell-inline"><span class="num">${r.memberCount}/${r.capacity}</span>
          <span class="meter"><i style="width:${ratio}%"></i></span></span></td>
        <td>${esc(r.ownerName || '—')}</td>
        <td class="hide-md">${r.isPublic ? `<span class="pill">${esc(t('roomPublic'))}</span>` : `<span class="pill warn">${esc(t('roomPrivate'))}</span>`}
            ${r.hasPassword ? `<span class="pill warn">${esc(t('roomPassword'))}</span>` : ''}</td>
        <td class="actions">
          <button class="icon-action" data-members="${esc(r.roomId)}" title="${t('roomMembersTitle')}">${ICON.users}</button>
          <button class="icon-action danger" data-close="${esc(r.roomId)}" title="${t('roomCloseTitle')}">${ICON.trash}</button>
        </td>
      </tr>`;
      }).join('')}</tbody></table>`;
  }
  $('roomsSummary').textContent = t('roomsSummary', { n: section.total });
  renderPager('roomsPager', section, pagesOf(section), loadRooms);
  bindRoomActions();
}

function bindRoomActions() {
  $('rooms').querySelectorAll('[data-members]').forEach((btn) =>
    btn.addEventListener('click', () => openMembers(btn.dataset.members)));
  $('rooms').querySelectorAll('[data-close]').forEach((btn) =>
    btn.addEventListener('click', async () => {
      const id = btn.dataset.close;
      if (!confirm(t('roomCloseConfirm', { id }))) return;
      await api('/rooms/' + encodeURIComponent(id), { method: 'DELETE' });
      banner(t('roomClosed', { id }), true);
      await refresh();
    }));
}

async function loadRooms() {
  const section = state.rooms;
  const offset = (section.page - 1) * section.size;
  const data = await api(`/rooms?limit=${section.size}&offset=${offset}`);
  section.loaded = true;
  renderRooms(data);
}

async function openMembers(roomId) {
  currentRoomId = roomId;
  membersData = null;
  $('membersDialog').showModal();
  await loadMembers(roomId);
}

async function loadMembers(roomId) {
  // 只负责取数据，画交给 renderMembers()：切语言时要能不重新请求就重画一遍
  membersData = await api('/rooms/' + encodeURIComponent(roomId) + '/members');
  renderMembers();
}

function renderMembers() {
  const roomId = currentRoomId;
  const data = membersData;
  if (!roomId || !data) return;
  $('membersTitle').textContent = t('membersTitleWith', { id: roomId });
  if (!data.items.length) {
    $('membersBody').innerHTML = `<div class="empty"><b>${esc(t('membersEmptyTitle'))}</b>${esc(t('membersEmptyBody'))}</div>`;
    return;
  }
  $('membersBody').innerHTML = `<table><thead><tr>
      <th scope="col">${esc(t('colNickname'))}</th><th scope="col">${esc(t('tabAccounts'))}</th><th scope="col">${esc(t('colPeerId'))}</th>
      <th scope="col">${esc(t('colStatus'))}</th><th scope="col" class="actions">${esc(t('colActions'))}</th>
    </tr></thead><tbody>${data.items.map((m) => `
    <tr>
      <td>${esc(m.displayName)}</td>
      <td>${esc(m.username)}</td>
      <td><span class="code mono">${esc(m.peerId)}</span></td>
      <td>${m.sharing ? `<span class="pill on">${esc(t('memberSharing'))}</span> ` : ''}${m.muted
        ? `<span class="pill">${esc(t('memberMuted'))}</span>` : `<span class="pill on">${esc(t('memberMicOn'))}</span>`}</td>
      <td class="actions"><button class="icon-action danger" data-kick="${esc(m.peerId)}" title="${t('memberKickTitle')}">${ICON.kick}</button></td>
    </tr>`).join('')}</tbody></table>`;

  $('membersBody').querySelectorAll('[data-kick]').forEach((btn) =>
    btn.addEventListener('click', async () => {
      const peerId = btn.dataset.kick;
      if (!confirm(t('memberKickConfirm', { id: peerId }))) return;
      await api('/rooms/' + encodeURIComponent(roomId) + '/kick', {
        method: 'POST', body: JSON.stringify({ peerId }),
      });
      banner(t('memberKicked', { id: peerId }), true);
      await loadMembers(roomId);
      await loadRooms();
    }));
}

// ------------------------------------------------------------------ 插件订阅
// 地址是**可编辑输入框**，所以定时刷新不能无条件重建 DOM（会把正在打字的人清空）。
// 分页之后「页面只画当前这一页」，真实的列表只能放在 pluginUrls 里，输入时写回数组。
let pluginUrls = [];
let subscriptionSnapshot = JSON.stringify([]);

function pluginPages() {
  return Math.max(1, Math.ceil(Math.max(pluginUrls.length, 1) / state.plugins.size));
}

function renderPlugins() {
  const section = state.plugins;
  const pages = pluginPages();
  if (section.page > pages) section.page = pages;
  const start = (section.page - 1) * section.size;
  const slice = pluginUrls.slice(start, start + section.size);

  if (!slice.length && !pluginUrls.length) {
    $('subscriptions').innerHTML = `<div class="empty"><b>${esc(t('pluginsEmptyTitle'))}</b>${esc(t('pluginsEmptyBody'))}</div>`;
  } else {
    $('subscriptions').innerHTML = slice.map((url, i) => `
      <div class="sub-row" data-row="${start + i}">
        <span class="sub-index num">${start + i + 1}</span>
        <input type="text" data-subscription-input spellcheck="false"
               placeholder="https://example.com/plugin.json" value="${esc(url)}">
        <button class="icon-action danger" data-remove-subscription title="${t('pluginsRemoveTitle')}">${ICON.trash}</button>
      </div>`).join('');
  }
  $('pluginsSummary').textContent = t('pluginsSummary', { n: pluginUrls.length });
  renderPager('pluginsPager', section, pages, () => renderPlugins());
}

function fillPlugins(urls) {
  const snapshot = JSON.stringify(urls);
  if (snapshot === subscriptionSnapshot) return;
  subscriptionSnapshot = snapshot;
  // 正在输入时不同步：等下次刷新（或保存）再说
  if (document.activeElement && document.activeElement.hasAttribute('data-subscription-input')) return;
  pluginUrls = urls.slice();
  renderPlugins();
}

async function loadPlugins() {
  const data = await api('/music/plugin-subscription');
  if (JSON.stringify(data.urls) === subscriptionSnapshot) { renderPlugins(); return; }
  fillPlugins(data.urls);
}

function addSubscriptionRow() {
  if (pluginUrls.length >= 20) { banner(t('pluginsLimit')); return; }
  pluginUrls.push('');
  state.plugins.page = pluginPages();
  renderPlugins();
  const inputs = $('subscriptions').querySelectorAll('[data-subscription-input]');
  if (inputs.length) inputs[inputs.length - 1].focus();
}

async function saveSubscriptions() {
  const urls = pluginUrls.map((url) => url.trim()).filter((url) => url);
  try {
    const saved = await api('/music/plugin-subscription', {
      method: 'PUT', body: JSON.stringify({ urls }),
    });
    pluginUrls = saved.urls.slice();
    subscriptionSnapshot = JSON.stringify(saved.urls);
    state.plugins.page = 1;
    renderPlugins();
    banner(saved.urls.length ? t('pluginsSaved', { n: saved.urls.length }) : t('pluginsCleared'), true);
  } catch (e) { /* api() 已提示 */ }
}

$('subscriptions').addEventListener('input', (event) => {
  const row = event.target.closest('[data-row]');
  if (!row) return;
  pluginUrls[Number(row.dataset.row)] = event.target.value;
});
$('subscriptions').addEventListener('click', (event) => {
  const btn = event.target.closest('[data-remove-subscription]');
  if (!btn) return;
  const row = btn.closest('[data-row]');
  pluginUrls.splice(Number(row.dataset.row), 1);
  renderPlugins();
});

// ------------------------------------------------------------------ 统一刷新
// silent=true 时（定时器）不重绘正在编辑的那一块，避免把输入框里的内容清掉。
async function refresh(options = {}) {
  const silent = options.silent === true;
  const tasks = [api('/overview').then(renderOverview)];
  if (state.tab === 'accounts') {
    if (!(silent && document.activeElement === $('userQuery'))) tasks.push(loadAccounts());
  } else if (state.tab === 'rooms') {
    tasks.push(loadRooms());
    if (currentRoomId) tasks.push(loadMembers(currentRoomId));
  } else {
    if (!silent) tasks.push(loadPlugins());
  }
  try {
    await Promise.all(tasks);
    setStatus(true, 'statusConnected');
  } catch (e) {
    /* 错误已在 api() 里提示 */
  }
}

// ------------------------------------------------------------------ 分页与工具条
// 分页：页码方块 + 上一页/下一页；页数多时中间用省略号
function renderPager(id, section, pages, reload) {
  const box = $(id);
  if (!box) return;
  const items = [`<button class="page-btn" data-go="prev" ${section.page <= 1 ? 'disabled' : ''} aria-label="${t('pagerPrev')}">‹</button>`];
  let gap = false;
  for (let p = 1; p <= pages; p += 1) {
    const near = Math.abs(p - section.page) <= 1;
    const edge = p <= 2 || p > pages - 2;
    if (pages > 7 && !near && !edge) {
      if (!gap) { items.push('<span class="page-gap">…</span>'); gap = true; }
      continue;
    }
    gap = false;
    items.push(`<button class="page-btn ${p === section.page ? 'active' : ''}" data-go="${p}">${p}</button>`);
  }
  items.push(`<button class="page-btn" data-go="next" ${section.page >= pages ? 'disabled' : ''} aria-label="${t('pagerNext')}">›</button>`);
  box.innerHTML = items.join('');
  box.onclick = (event) => {
    const btn = event.target.closest('[data-go]');
    if (!btn || btn.disabled) return;
    const go = btn.dataset.go;
    if (go === 'prev') section.page = Math.max(1, section.page - 1);
    else if (go === 'next') section.page = Math.min(pages, section.page + 1);
    else section.page = Number(go);
    reload();
  };
}

// 自绘下拉：原生 <select> 展开的那张列表由系统渲染，改不出主题样式
function makeSelect(id, options, initial, onChange) {
  const host = $(id);
  if (!host) return;
  host.dataset.value = String(initial);
  host.innerHTML = `<span class="select-value"></span>
    <svg class="select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    <div class="select-menu" hidden>${options.map((o) => `<button type="button" class="select-option" data-option="${o}">${o}</button>`).join('')}</div>`;
  const valueEl = host.querySelector('.select-value');
  const menu = host.querySelector('.select-menu');
  const sync = () => {
    valueEl.textContent = host.dataset.value;
    menu.querySelectorAll('.select-option').forEach((btn) => {
      btn.setAttribute('aria-selected', String(btn.dataset.option === host.dataset.value));
    });
  };
  const close = () => { menu.hidden = true; };
  host.addEventListener('click', (event) => {
    const option = event.target.closest('[data-option]');
    if (option) {
      host.dataset.value = option.dataset.option;
      sync();
      close();
      onChange(Number(option.dataset.option));
      return;
    }
    menu.hidden = !menu.hidden;
  });
  host.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') { close(); return; }
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      menu.hidden = !menu.hidden;
    }
  });
  document.addEventListener('click', (event) => { if (!host.contains(event.target)) close(); });
  sync();
}
makeSelect('usersPageSize', [20, 50, 100], 20, (size) => {
  state.accounts.size = size; state.accounts.page = 1; loadAccounts();
});
makeSelect('roomsPageSize', [20, 50, 100], 20, (size) => {
  state.rooms.size = size; state.rooms.page = 1; loadRooms();
});
makeSelect('pluginsPageSize', [5, 10, 20], 5, (size) => {
  state.plugins.size = size; state.plugins.page = 1; renderPlugins();
});
// 清空按钮：只在有内容时出现，点了清空并重新加载列表
function syncSearchClear() {
  const btn = $('userQueryClear');
  if (btn) btn.dataset.visible = $('userQuery').value ? 'true' : 'false';
}
$('userQuery').addEventListener('input', syncSearchClear);
$('userQuery').addEventListener('keydown', (event) => {
  if (event.key === 'Enter') { state.accounts.page = 1; loadAccounts(); }
});
$('userQueryClear').addEventListener('click', () => {
  $('userQuery').value = '';
  syncSearchClear();
  state.accounts.page = 1;
  loadAccounts();
  $('userQuery').focus();
});
syncSearchClear();
$('refreshBtn').addEventListener('click', () => refresh());
$('closeMembers').addEventListener('click', () => { currentRoomId = null; $('membersDialog').close(); });
$('addSubscriptionBtn').addEventListener('click', addSubscriptionRow);
$('saveSubscriptionsBtn').addEventListener('click', saveSubscriptions);

$('registrationToggle').addEventListener('change', async (event) => {
  const allow = event.target.checked;
  try {
    const o = await api('/registration', { method: 'POST', body: JSON.stringify({ allow }) });
    renderOverview(o);
    banner(allow ? t('regOpened') : t('regClosed'), true);
  } catch (err) {
    event.target.checked = !allow;
  }
});

// ------------------------------------------------------------------ 登录 / 改密码 / 新建账号
$('confirmSetup').addEventListener('click', async () => {
  const password = $('setupPassword').value;
  const again = $('setupPassword2').value;
  const error = $('setupError');
  if (password.length < passwordMinLength) { error.textContent = t('pwdTooShort', { min: passwordMinLength }); return; }
  if (password !== again) { error.textContent = t('pwdMismatch'); return; }
  error.textContent = '';
  try {
    const result = await postPublic('/setup', { password });
    afterLogin(result, t('setupDone'));
  } catch (e) {
    if (e.code === 'admin_already_initialized') { showLogin(); return; }
    error.textContent = e.message;
  }
});

$('confirmLogin').addEventListener('click', async () => {
  const password = $('loginPassword').value;
  const error = $('loginError');
  if (!password) { error.textContent = t('loginEmpty'); return; }
  error.textContent = '';
  try {
    const result = await postPublic('/login', { password });
    afterLogin(result, t('loginDone'));
  } catch (e) {
    if (e.code === 'admin_not_initialized') { showSetup(false); return; }
    error.textContent = e.message;
  }
});

$('changePasswordBtn').addEventListener('click', () => {
  $('oldPassword').value = '';
  $('newPassword2').value = '';
  $('newPassword3').value = '';
  $('passwordError').textContent = '';
  $('passwordDialog').showModal();
  $('oldPassword').focus();
});
$('cancelPassword').addEventListener('click', () => $('passwordDialog').close());
$('confirmPassword').addEventListener('click', async () => {
  const currentPassword = $('oldPassword').value;
  const newPassword = $('newPassword2').value;
  const error = $('passwordError');
  if (!currentPassword) { error.textContent = t('pwdEmptyCurrent'); return; }
  if (newPassword.length < passwordMinLength) { error.textContent = t('pwdNewTooShort', { min: passwordMinLength }); return; }
  if (newPassword !== $('newPassword3').value) { error.textContent = t('pwdNewMismatch'); return; }
  error.textContent = '';
  try {
    const result = await api('/password', {
      method: 'POST',
      body: JSON.stringify({ currentPassword, newPassword }),
    });
    saveToken(result.accessToken);
    $('passwordDialog').close();
    banner(t('pwdDone'), true);
  } catch (e) {
    error.textContent = e.message === 'api' ? t('pwdFailed') : e.message;
  }
});

$('logoutBtn').addEventListener('click', () => {
  saveToken('');
  handleUnauthorized(t('authLoggedOut'));
});

$('newUserBtn').addEventListener('click', () => {
  $('newUsername').value = ''; $('newDisplayName').value = ''; $('newPassword').value = '';
  $('newUserDialog').showModal();
  $('newUsername').focus();
});
$('cancelNewUser').addEventListener('click', () => $('newUserDialog').close());
$('confirmNewUser').addEventListener('click', async () => {
  const username = $('newUsername').value.trim();
  const password = $('newPassword').value;
  const displayName = $('newDisplayName').value.trim();
  if (!username || !password) { banner(t('newUserMissing')); return; }
  try {
    await api('/users', {
      method: 'POST',
      body: JSON.stringify({ username, password, displayName: displayName || undefined }),
    });
    $('newUserDialog').close();
    banner(t('newUserCreated', { user: username }), true);
    await refresh();
  } catch (e) { /* api() 已提示 */ }
});

// 设置密码 / 登录这两个框必须填完，别让人按 Esc 关掉就以为没救了
['setupDialog', 'loginDialog'].forEach((id) =>
  $(id).addEventListener('cancel', (event) => event.preventDefault()));

// 密码框回车 = 点确认
$('setupPassword2').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('confirmSetup').click(); });
$('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('confirmLogin').click(); });
$('newPassword3').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('confirmPassword').click(); });

// 首屏：先画一版空骨架（登录之前也有内容，不会看到空白页）
renderPlugins();
boot();
